<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no"
  >

  <title>CITY HEAT</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game"></div>

  <!-- HUD -->
  <div id="hud">

    <div class="brand">
      CITY HEAT
    </div>

    <div class="stats">

      <span>
        💵 $<b id="money">250</b>
      </span>

      <span>
        ❤️ <b id="health">100</b>
      </span>

      <span>
        ⭐ <b id="wanted">0</b>
      </span>

    </div>

    <div
      class="mission"
      id="mission"
    >
      MISSION: Explore the city
    </div>

    <div
      class="hint"
      id="hint"
    >
      WASD move • E enter car • Shift sprint
    </div>

    <div id="minimap">

      <canvas
        id="map"
        width="170"
        height="170"
      ></canvas>

    </div>

  </div>


  <!-- MOBILE CONTROLS -->

  <div id="mobile">

    <div class="movement">

      <button data-key="w">▲</button>

      <div>

        <button data-key="a">◀</button>

        <button data-key="s">▼</button>

        <button data-key="d">▶</button>

      </div>

    </div>

    <div class="actions">

      <button data-key="e">
        ENTER
      </button>

      <button data-key="shift">
        RUN
      </button>

    </div>

  </div>


  <!-- START SCREEN -->

  <div id="overlay">

    <h1>CITY HEAT</h1>

    <p>
      Open-world 3D city
    </p>

    <button id="start">
      START GAME
    </button>

  </div>


  <script
    type="module"
    src="game.js"
  ></script>

</body>
</html>
