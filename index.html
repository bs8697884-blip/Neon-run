<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CITY HEAT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <!-- HUD -->
    <div id="hud">

        <div id="brand">CITY HEAT</div>

        <div id="stats">
            <div>💵 $<span id="money">250</span></div>
            <div>❤️ <span id="health">100</span></div>
            <div>⭐ <span id="wanted">0</span></div>
        </div>

        <div id="mission">
            Explore the city
        </div>

        <div id="hint">
            WASD to move
        </div>

        <canvas id="minimap" width="160" height="160"></canvas>

    </div>


    <!-- START SCREEN -->
    <div id="overlay">

        <div id="title">
            CITY HEAT
        </div>

        <div id="subtitle">
            OPEN WORLD CITY
        </div>

        <button id="start">
            PLAY
        </button>

    </div>


    <!-- MOBILE CONTROLS -->
    <div id="mobileControls">

        <div id="movement">

            <button data-key="w">▲</button>

            <div>
                <button data-key="a">◀</button>
                <button data-key="s">▼</button>
                <button data-key="d">▶</button>
            </div>

        </div>


        <div id="actions">

            <button data-key="shift">
                RUN
            </button>

            <button data-key="e">
                ENTER
            </button>

        </div>

    </div>


    <script type="module" src="./game.js"></script>

</body>
</html>
